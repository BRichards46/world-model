evaluation_frequency: ME
min_train_observations: 60
min_bucket_observations: 15
return_method: normalized_price_change
normalization_window: 252
normalization_min_periods: 63

horizons:
  one_month: 21
  three_months: 63
  six_months: 126
  twelve_months: 252

features:
  include_aggregate_counts: true
  include_group_counts: true
  include_trigger_failed: true
  include_trigger_margins: true

asset_groups:
  equity:
    label: Equity index futures
    driver_groups:
      - sales_production
      - employment
      - inflation
      - cfnai
    assets:
