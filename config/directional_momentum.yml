as_of_lag_days: 0

# Weights favor 6-12 months: the trend study (docs/trend_range_study.md) found 12-month trend
# strongest and 3-month weakest; 1 and 3 months stay visible as context.
horizons:
  - id: one_month
    label: 1m
    days: 21
    weight: 0.05
  - id: three_months
    label: 3m
    days: 63
    weight: 0.15
  - id: six_months
    label: 6m
    days: 126
    weight: 0.25
  - id: ten_months
    label: 10m
    days: 210
    weight: 0.25
  - id: twelve_months
    label: 12m
    days: 252
    weight: 0.30

classification:
  positive_threshold: 0.25
  strong_threshold: 1.00
  minimum_components: 3
  strong_alignment: 4
  directional_alignment: 3

freshness:
  due_after_days: 3
  stale_after_days: 7

