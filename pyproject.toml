[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-model"
version = "0.1.0"
description = "Market and macro state models backed by local research data."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "pyarrow>=12",
  "PyYAML>=6",
]

[project.scripts]
world-market-state = "world_model.cli.market_state:main"
world-market-walk-forward = "world_model.cli.market_walk_forward:main"
world-market-breadth = "world_model.cli.market_breadth:main"
world-market-forecast = "world_model.cli.market_forecast:main"
world-market-targets = "world_model.cli.market_targets:main"
world-economic-state = "world_model.cli.economic_state:main"
world-macro-dashboard = "world_model.cli.macro_dashboard:main"
world-macro-market-validation = "world_model.cli.macro_market_validation:main"
world-macro-regime-validation = "world_model.cli.macro_regime_validation:main"
world-refresh-asset-indications = "world_model.cli.refresh_asset_indications:main"
world-macro-regime-performance = "world_model.cli.macro_regime_performance:main"
world-macro-regime-forecast = "world_model.cli.macro_regime_forecast:main"
world-gtt-risk-validation = "world_model.cli.gtt_risk_validation:main"
world-gtt-production-validation = "world_model.cli.gtt_production_validation:main"
world-economic-triggers = "world_model.cli.economic_triggers:main"
world-economic-asset-drivers = "world_model.cli.economic_asset_drivers:main"
world-combined-state = "world_model.cli.combined_state:main"
world-simple-market = "world_model.cli.simple_market:main"
world-simple-economic = "world_model.cli.simple_economic:main"
world-growth-trend = "world_model.cli.growth_trend:main"
world-directional-momentum = "world_model.cli.directional_momentum:main"
world-directional-momentum-validation = "world_model.cli.directional_momentum_validation:main"
world-directional-momentum-regime-validation = "world_model.cli.directional_momentum_regime_validation:main"
world-premium-selling = "world_model.cli.premium_selling:main"
world-macro-release-forecast = "world_model.cli.macro_release_forecast:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
